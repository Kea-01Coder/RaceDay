name: .NET Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 
          
      # --- PART 2 API ---
      - name: Restore API
        run: dotnet restore "./Part 2/RaceDay/RaceDay/RaceDay.csproj"
        
      - name: Build API
        run: dotnet build "./Part 2/RaceDay/RaceDay/RaceDay.csproj" --no-restore --configuration Release
        
      # --- PART 2 TESTS ---
      - name: Restore Tests
        run: dotnet restore "./Part 2/RaceDay/RaceDay.Tests/RaceDay.Tests.csproj"
        
      - name: Run Unit Tests
        run: dotnet test "./Part 2/RaceDay/RaceDay.Tests/RaceDay.Tests.csproj" --no-build --configuration Release --verbosity normal
        
      # --- PART 3 MVC ---
      - name: Restore MVC
        # Note: I used the exact folder name from your screenshot "RceDay_PoE"
        run: dotnet restore "./Part 3/RaceDay_PoE(Part 3)/RceDay_PoE/RaceDay_PoE.csproj"
        
      - name: Build MVC
        # Note: I used the exact folder name from your screenshot "RceDay_PoE"
        run: dotnet build "./Part 3/RaceDay_PoE(Part 3)/RceDay_PoE/RaceDay_PoE.csproj" --no-restore --configuration Release
        
      - name: Build Success
        run: echo "Both Part 2 API and Part 3 MVC built successfully!"
