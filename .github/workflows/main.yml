name: Validate Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check PROG6212 POE PART 1 PDF file exists
        run: |
          if ls *.pdf 2>/dev/null | grep -q .; then
            echo " PDF file found"
            ls *.pdf
          else
            echo " No PDF file found in root folder"
            echo "   Expected: PROG6212 POE PART 1.pdf or similar"
            exit 1
          fi
      
      - name: Check SQL script file exists
        run: |
          if ls *.sql 2>/dev/null | grep -q .; then
            echo " SQL script found"
            ls *.sql
          else
            echo " No SQL script found in root folder"
            echo "   Expected: RaceDay.sql"
            exit 1
          fi
      
      - name: Validate SQL file
        run: |
          SQL_FILE=$(ls *.sql 2>/dev/null | head -1)
          if [ -f "$SQL_FILE" ]; then
            echo "Checking SQL file: $SQL_FILE"
            
            # Count tables
            TABLE_COUNT=$(grep -c "CREATE TABLE" "$SQL_FILE" || echo "0")
            echo "Found $TABLE_COUNT CREATE TABLE statements"
            
            # Count foreign keys
            FK_COUNT=$(grep -c "FOREIGN KEY" "$SQL_FILE" || echo "0")
            echo "Found $FK_COUNT FOREIGN KEY definitions"
            
            # Count INSERT statements
            INSERT_COUNT=$(grep -c "INSERT INTO" "$SQL_FILE" || echo "0")
            echo "Found $INSERT_COUNT INSERT statements"
            
            if [ $TABLE_COUNT -lt 6 ]; then
              echo " Expected at least 6 tables, found $TABLE_COUNT"
              exit 1
            fi
            
            echo " SQL validation passed"
          else
            echo " No SQL file found"
            exit 1
          fi
      
      - name: Check commit count
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Total commits: $COMMIT_COUNT"
          
          if [ $COMMIT_COUNT -lt 12 ]; then
            echo " Only $COMMIT_COUNT commits. Minimum required is 12."
          else
            echo " $COMMIT_COUNT commits - meets minimum requirement of 12"
          fi
      
      - name: List all files in root
        run: |
          echo "📁 Contents of root folder:"
          ls -la
      
      - name: Final validation summary
        run: |
          echo "========================================"
          echo " Validation Complete"
          echo "========================================"
          echo ""
          echo "Summary:"
          echo "  📄 PDF file: Found"
          echo "  🗄️  SQL Script:  Found"
          echo "  📊 SQL Tables:  Validated (6+ tables)"
          echo "  📝 Commits:  Checked (20+ required)"
          echo ""
          echo "All required documents are present!"
          echo "========================================"
